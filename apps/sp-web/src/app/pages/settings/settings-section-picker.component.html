<div class="picker">
  <button
    #trigger
    type="button"
    class="picker-trigger"
    data-testid="settings-section-picker"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    [attr.aria-label]="'Settings section: ' + (active()?.label ?? 'choose one')"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    <span class="picker-text">
      <span class="picker-group">{{ activeGroupLabel() }}</span>
      <span class="picker-current">{{ active()?.label ?? 'Choose a section' }}</span>
    </span>
    <i class="pi pi-chevron-down picker-chevron" [class.open]="open()" aria-hidden="true"></i>
  </button>

  @if (open()) {
    <nav #panel class="picker-panel" aria-label="Settings sections" [id]="panelId">
      @for (group of groups(); track group.id) {
        <section class="picker-section" [attr.aria-labelledby]="panelId + '-' + group.id">
          <h2 class="picker-section-title" [id]="panelId + '-' + group.id">{{ group.label }}</h2>
          <ul>
            @for (item of group.items; track item.route) {
              <li>
                <a
                  class="settings-nav-link"
                  [class.active]="item === active()"
                  [routerLink]="item.route"
                  [attr.aria-current]="item === active() ? 'page' : null"
                  [attr.data-testid]="'settings-nav-' + item.label.toLowerCase()"
                  (click)="onLinkClick()"
                >
                  <span>{{ item.label }}</span>
                  @if (item === active()) {
                    <i class="pi pi-check" aria-hidden="true"></i>
                  }
                </a>
              </li>
            }
          </ul>
        </section>
      }
    </nav>
  }
</div>
