<div class="app-shell">
  <div class="global-controls">
    <app-theme-toggle class="global-theme-toggle" />
    <app-image-obscuration-toggle class="global-image-obscuration-toggle" />
  </div>
  <router-outlet></router-outlet>
  <app-release-picker-host />
  <app-lock-screen />
  <app-quick-hide-cover />
  <app-status />
  <p-toast key="global" position="bottom-right" styleClass="app-toast" [baseZIndex]="1200" />
  <!-- Only ever opened by a tap, so its code can wait until the page is up. -->
  @defer (on idle) {
    <p-confirmdialog key="app-destructive" styleClass="app-confirm-dialog" [baseZIndex]="1250" />
  }
</div>
