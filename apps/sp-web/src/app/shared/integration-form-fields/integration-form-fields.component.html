<div class="integration-form-fields" [formGroup]="form">
  <div class="field-grid">
    <label>
      <span class="field-label">Name</span>
      <input pInputText type="text" formControlName="name" />
    </label>

    <label>
      <span class="field-label">Address</span>
      <input
        pInputText
        type="text"
        formControlName="baseUrl"
        placeholder="http://192.168.1.10:9999"
        spellcheck="false"
        autocapitalize="off"
      />
    </label>

    <label>
      <span class="field-label">API key</span>
      <input
        pInputText
        type="password"
        formControlName="apiKey"
        autocomplete="off"
        [placeholder]="hasStoredApiKey ? 'Saved · leave blank to keep it' : 'Paste the API key'"
      />
    </label>
  </div>

  @if (hasStoredApiKey || showEnabledToggle) {
    <div class="switches">
      @if (showEnabledToggle) {
        <label class="switch-row">
          <input
            type="checkbox"
            class="app-switch"
            role="switch"
            formControlName="enabled"
            aria-label="Enabled"
            [id]="enabledInputId"
          />
          <span>Enabled</span>
        </label>
      }
      @if (hasStoredApiKey) {
        <label class="switch-row">
          <input
            type="checkbox"
            class="app-switch"
            role="switch"
            formControlName="clearApiKey"
            aria-label="Remove the saved key"
          />
          <span>Remove the saved key <small>(for a server without one)</small></span>
        </label>
      }
    </div>
  }
</div>
