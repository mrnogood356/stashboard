name: Idea
description: Something Stashboard could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What you want to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it could work
      description: Optional. Sketches, screenshots or another app that does it well are welcome.
