name: Commit Messages

# Release notes and "What's new" are built from commit messages: only ones
# starting with a type (feat:, fix:…) reach them. Runs when the title is
# edited too, since a squash merge uses it.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check each commit, and the title, starts with a type
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # A squash merge makes the title the commit on main.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-commit-messages.sh "$BASE" "$HEAD"
